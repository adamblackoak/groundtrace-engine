AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GroundTrace Memory API

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
  BedrockModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0

Resources:
  GroundTraceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: groundtrace_memory.handler.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /memory
            Method: POST

Outputs:
  MemoryApi:
    Description: GroundTrace Memory endpoint
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/memory'
